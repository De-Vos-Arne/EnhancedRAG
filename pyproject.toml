[project]
name = "enhanced-rag"
version = "0.1.0"
description = "Metadata-enhanced RAG over a formatting-rich personal knowledge archive"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "numpy>=1.24",
    "requests>=2.31",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enhanced_rag"]
